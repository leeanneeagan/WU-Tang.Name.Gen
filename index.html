<!-- Logic Flow Summary

Ask 5 survey questions.

Map each answer to a list of Wu-Tang-style words.

Randomly select one word from each chosen category.

Combine 2–3 of these words into a final name.

Optionally add city/place flair. -->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wu-Tang Name Gen</title>
</head>

<body>
    <img src="img/nameGen.png">
    <div>
        <label for="element">Choose your Favorite Element:</label>
        <select id="element" name="element">
            <option value="fire">Fire</option>
            <option value="water">Water</option>
            <option value="wind">Wind</option>
            <option value="earth">Earth</option>
            <option value="lightning">Lightning</option>
        </select>



    </div>

    <div>
        <label for="animal">Choose your Favorite Animal:</label>
        <select id="animal" name="animal">
            <option value="tiger">Tiger</option>
            <option value="wolf">Wolf</option>
            <option value="eagle">Eagle</option>
            <option value="snake">Snake</option>
            <option value="panther">Panther</option>
        </select>
    </div>


    <div>
        <label for="color">Choose your Favorite Color:</label>
        <select id="color" name="color">
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
            <option value="green">Green</option>
            <option value="black">Black</option>
            <option value="blue">Blue</option>
        </select>
    </div>


    <div>
        <label for="city">Choose your Favorite City:</label>
        <select id="city" name="city">
            <option value="boston">Boston</option>
            <option value="newyork">New York</option>
            <option value="philly">Philly</option>
            <option value="miami">Miami</option>
        </select>
    </div>


    <div>
        <label for="city">Choose a Style:</label>
        <select id="city" name="city">
            <option value="master">Master</option>
            <option value="ghost">Ghost</option>
            <option value="kid">Kid</option>
            <option value="assassin">Assassin</option>
            <option value="dragon">Dragon</option>
        </select>
    </div>











</body>

</html>
